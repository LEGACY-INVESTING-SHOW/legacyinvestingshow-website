<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Monthly Cash Flow -->
  <g transform="translate(10, 15)" filter="url(#shadow)">
    <rect width="185" height="170" rx="16" fill="white"/>
    <rect width="185" height="6" rx="3" fill="url(#greenGrad)"/>
    <circle cx="92" cy="55" r="28" fill="#ecfdf5"/>
    <text x="92" y="62" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="bold" fill="#059669">$</text>
    <text x="92" y="110" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="bold" fill="#1f2937">$35K</text>
    <text x="92" y="135" text-anchor="middle" font-family="system-ui" font-size="13" fill="#6b7280">Monthly Cash Flow</text>
    <rect x="52" y="148" width="80" height="22" rx="11" fill="#ecfdf5"/>
    <text x="92" y="163" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#059669">+$5K/property</text>
  </g>

  <!-- Card 2: Properties -->
  <g transform="translate(205, 15)" filter="url(#shadow)">
    <rect width="185" height="170" rx="16" fill="white"/>
    <rect width="185" height="6" rx="3" fill="url(#blueGrad)"/>
    <circle cx="92" cy="55" r="28" fill="#eef2ff"/>
    <path d="M82 60 L92 50 L102 60 L102 70 L82 70 Z" fill="#6366f1"/>
    <text x="92" y="110" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="bold" fill="#1f2937">7</text>
    <text x="92" y="135" text-anchor="middle" font-family="system-ui" font-size="13" fill="#6b7280">Properties Managed</text>
    <rect x="52" y="148" width="80" height="22" rx="11" fill="#eef2ff"/>
    <text x="92" y="163" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#6366f1">Austin, TX</text>
  </g>

  <!-- Card 3: Gross Per Property -->
  <g transform="translate(400, 15)" filter="url(#shadow)">
    <rect width="185" height="170" rx="16" fill="white"/>
    <rect width="185" height="6" rx="3" fill="url(#orangeGrad)"/>
    <circle cx="92" cy="55" r="28" fill="#fef3c7"/>
    <path d="M85 55 L92 48 L99 55 M92 48 L92 68" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="92" y="110" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="bold" fill="#1f2937">$10K</text>
    <text x="92" y="135" text-anchor="middle" font-family="system-ui" font-size="13" fill="#6b7280">Gross Per Property</text>
    <rect x="47" y="148" width="90" height="22" rx="11" fill="#fef3c7"/>
    <text x="92" y="163" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#d97706">Monthly Target</text>
  </g>

  <!-- Card 4: Profit Margin -->
  <g transform="translate(595, 15)" filter="url(#shadow)">
    <rect width="185" height="170" rx="16" fill="white"/>
    <rect width="185" height="6" rx="3" fill="url(#purpleGrad)"/>
    <circle cx="92" cy="55" r="28" fill="#f3e8ff"/>
    <circle cx="92" cy="55" r="18" fill="none" stroke="#8b5cf6" stroke-width="4"/>
    <path d="M92 43 L92 55 L100 55" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="92" y="110" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="bold" fill="#1f2937">50%</text>
    <text x="92" y="135" text-anchor="middle" font-family="system-ui" font-size="13" fill="#6b7280">Profit Margin</text>
    <rect x="47" y="148" width="90" height="22" rx="11" fill="#f3e8ff"/>
    <text x="92" y="163" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#7c3aed">After Expenses</text>
  </g>
</svg>