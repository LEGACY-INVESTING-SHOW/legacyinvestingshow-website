<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="pricingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="messagingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="cleaningGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="researchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="#fafafa" rx="16"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="bold" fill="#1f2937">Gary's Tech Stack for 7 Properties</text>

  <!-- Tool 1: Price Labs -->
  <g transform="translate(25, 60)" filter="url(#shadow)">
    <rect width="155" height="130" rx="14" fill="white"/>
    <rect width="155" height="8" rx="4" fill="url(#pricingGrad)"/>
    <rect x="12" y="20" width="70" height="24" rx="12" fill="url(#pricingGrad)"/>
    <text x="47" y="36" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="white">PRICING</text>
    <text x="77" y="72" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1f2937">Price Labs</text>
    <line x1="30" y1="85" x2="125" y2="85" stroke="#e5e7eb" stroke-width="1"/>
    <text x="77" y="105" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">Dynamic pricing</text>
    <text x="77" y="120" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">optimization</text>
  </g>

  <!-- Tool 2: Hospitable -->
  <g transform="translate(195, 60)" filter="url(#shadow)">
    <rect width="155" height="130" rx="14" fill="white"/>
    <rect width="155" height="8" rx="4" fill="url(#messagingGrad)"/>
    <rect x="12" y="20" width="85" height="24" rx="12" fill="url(#messagingGrad)"/>
    <text x="54" y="36" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="white">MESSAGING</text>
    <text x="77" y="72" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1f2937">Hospitable</text>
    <line x1="30" y1="85" x2="125" y2="85" stroke="#e5e7eb" stroke-width="1"/>
    <text x="77" y="105" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">Automated guest</text>
    <text x="77" y="120" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">communication</text>
  </g>

  <!-- Tool 3: Turno -->
  <g transform="translate(365, 60)" filter="url(#shadow)">
    <rect width="155" height="130" rx="14" fill="white"/>
    <rect width="155" height="8" rx="4" fill="url(#cleaningGrad)"/>
    <rect x="12" y="20" width="80" height="24" rx="12" fill="url(#cleaningGrad)"/>
    <text x="52" y="36" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="white">CLEANING</text>
    <text x="77" y="72" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1f2937">Turno</text>
    <line x1="30" y1="85" x2="125" y2="85" stroke="#e5e7eb" stroke-width="1"/>
    <text x="77" y="105" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">Cleaning team</text>
    <text x="77" y="120" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">coordination</text>
  </g>

  <!-- Tool 4: Air DNA -->
  <g transform="translate(535, 60)" filter="url(#shadow)">
    <rect width="155" height="130" rx="14" fill="white"/>
    <rect width="155" height="8" rx="4" fill="url(#researchGrad)"/>
    <rect x="12" y="20" width="80" height="24" rx="12" fill="url(#researchGrad)"/>
    <text x="52" y="36" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="white">RESEARCH</text>
    <text x="77" y="72" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1f2937">Air DNA</text>
    <line x1="30" y1="85" x2="125" y2="85" stroke="#e5e7eb" stroke-width="1"/>
    <text x="77" y="105" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">Market data &amp;</text>
    <text x="77" y="120" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6b7280">analysis</text>
  </g>

  <!-- Automation Benefit Box -->
  <g transform="translate(75, 210)" filter="url(#shadow)">
    <rect width="550" height="95" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <circle cx="45" cy="47" r="22" fill="#d1fae5"/>
    <path d="M37 47 L43 53 L55 41" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="38" font-family="system-ui" font-size="15" font-weight="bold" fill="#065f46">Automation Benefit</text>
    <text x="85" y="58" font-family="system-ui" font-size="12" fill="#065f46">With these tools, Gary manages 7+ properties without being</text>
    <text x="85" y="75" font-family="system-ui" font-size="12" fill="#065f46">consumed by daily operations.</text>
    <rect x="380" y="55" width="150" height="26" rx="13" fill="#10b981"/>
    <text x="455" y="72" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="white">Goal: 20-30 per market</text>
  </g>
</svg>