<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bar-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6b7280; }
    .bar-value { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1f2937; }
    .bar-before { fill: #e5e7eb; }
    .bar-after { fill: #22c55e; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #374151; }
  </style>

  <text x="350" y="30" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#1f2937">Gary's Transformation: Before vs After</text>

  <!-- Legend -->
  <rect x="250" y="50" width="16" height="16" rx="3" class="bar-before"/>
  <text x="272" y="62" font-family="system-ui" font-size="11" fill="#6b7280">Before (2017)</text>
  <rect x="370" y="50" width="16" height="16" rx="3" class="bar-after"/>
  <text x="392" y="62" font-family="system-ui" font-size="11" fill="#6b7280">After (2023)</text>

  <!-- Monthly Cash Flow -->
  <g transform="translate(50, 90)">
    <text x="0" y="15" class="section-title">Monthly Cash Flow</text>
    <rect x="140" y="0" width="30" height="28" rx="4" class="bar-before"/>
    <text x="180" y="19" class="bar-value">$0</text>
    <rect x="140" y="35" width="350" height="28" rx="4" class="bar-after"/>
    <text x="500" y="54" class="bar-value">$35,000</text>
  </g>

  <!-- Properties -->
  <g transform="translate(50, 165)">
    <text x="0" y="15" class="section-title">Properties Owned</text>
    <rect x="140" y="0" width="50" height="28" rx="4" class="bar-before"/>
    <text x="200" y="19" class="bar-value">1 (primary)</text>
    <rect x="140" y="35" width="175" height="28" rx="4" class="bar-after"/>
    <text x="325" y="54" class="bar-value">7 investment properties</text>
  </g>

  <!-- Passive Income Sources -->
  <g transform="translate(50, 240)">
    <text x="0" y="15" class="section-title">Income Sources</text>
    <rect x="140" y="0" width="100" height="28" rx="4" class="bar-before"/>
    <text x="250" y="19" class="bar-value">Consulting only</text>
    <rect x="140" y="35" width="280" height="28" rx="4" class="bar-after"/>
    <text x="430" y="54" class="bar-value">Consulting + $35K passive</text>
  </g>

  <!-- Summary Box -->
  <g transform="translate(130, 305)">
    <rect width="440" height="40" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="220" y="26" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#166534">From tech executive to $35K/month passive income in 3 years</text>
  </g>
</svg>