<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#1f2937">Gary's Journey to $35K/Month</text>

  <!-- Timeline track -->
  <rect x="40" y="115" width="720" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="40" y="115" width="720" height="8" rx="4" fill="url(#timelineGrad)"/>

  <!-- Milestone 1: 2006 -->
  <g transform="translate(70, 0)">
    <circle cy="119" r="16" fill="white" stroke="#6366f1" stroke-width="4" filter="url(#shadow)"/>
    <circle cy="119" r="6" fill="#6366f1"/>
    <g filter="url(#shadow)">
      <rect x="-50" y="145" width="100" height="55" rx="10" fill="url(#cardGrad)" stroke="#e5e7eb" stroke-width="1"/>
      <text x="0" y="167" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#6366f1">2006</text>
      <text x="0" y="183" text-anchor="middle" font-family="system-ui" font-size="10" fill="#374151">First Home</text>
      <text x="0" y="195" text-anchor="middle" font-family="system-ui" font-size="9" fill="#9ca3af">Renovations</text>
    </g>
  </g>

  <!-- Milestone 2: 2012 -->
  <g transform="translate(210, 0)">
    <circle cy="119" r="16" fill="white" stroke="#7c3aed" stroke-width="4" filter="url(#shadow)"/>
    <circle cy="119" r="6" fill="#7c3aed"/>
    <g filter="url(#shadow)">
      <rect x="-50" y="55" width="100" height="55" rx="10" fill="url(#cardGrad)" stroke="#e5e7eb" stroke-width="1"/>
      <text x="0" y="77" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#7c3aed">2012</text>
      <text x="0" y="93" text-anchor="middle" font-family="system-ui" font-size="10" fill="#374151">First Airbnb Stay</text>
      <text x="0" y="105" text-anchor="middle" font-family="system-ui" font-size="9" fill="#9ca3af">As a Guest</text>
    </g>
  </g>

  <!-- Milestone 3: 2017 -->
  <g transform="translate(350, 0)">
    <circle cy="119" r="16" fill="white" stroke="#a78bfa" stroke-width="4" filter="url(#shadow)"/>
    <circle cy="119" r="6" fill="#a78bfa"/>
    <g filter="url(#shadow)">
      <rect x="-50" y="145" width="100" height="55" rx="10" fill="url(#cardGrad)" stroke="#e5e7eb" stroke-width="1"/>
      <text x="0" y="167" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#8b5cf6">2017</text>
      <text x="0" y="183" text-anchor="middle" font-family="system-ui" font-size="10" fill="#374151">Left Chegg</text>
      <text x="0" y="195" text-anchor="middle" font-family="system-ui" font-size="9" fill="#9ca3af">Consulting</text>
    </g>
  </g>

  <!-- Milestone 4: 2020 -->
  <g transform="translate(490, 0)">
    <circle cy="119" r="16" fill="white" stroke="#34d399" stroke-width="4" filter="url(#shadow)"/>
    <circle cy="119" r="6" fill="#34d399"/>
    <g filter="url(#shadow)">
      <rect x="-55" y="55" width="110" height="55" rx="10" fill="url(#cardGrad)" stroke="#e5e7eb" stroke-width="1"/>
      <text x="0" y="77" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#059669">2020</text>
      <text x="0" y="93" text-anchor="middle" font-family="system-ui" font-size="10" fill="#374151">First Listing</text>
      <text x="0" y="105" text-anchor="middle" font-family="system-ui" font-size="9" fill="#9ca3af">Austin Entry</text>
    </g>
  </g>

  <!-- Milestone 5: 2023 -->
  <g transform="translate(630, 0)">
    <circle cy="119" r="20" fill="#10b981" stroke="white" stroke-width="4" filter="url(#shadow)"/>
    <text x="0" y="124" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="white">NOW</text>
    <g filter="url(#shadow)">
      <rect x="-55" y="145" width="110" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="167" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#059669">2023</text>
      <text x="0" y="183" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#374151">7 Properties</text>
      <text x="0" y="198" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#10b981">$35K/mo</text>
    </g>
  </g>

  <!-- Future arrow -->
  <g transform="translate(730, 119)">
    <polygon points="0,-8 15,0 0,8" fill="#10b981"/>
    <text x="25" y="5" font-family="system-ui" font-size="10" fill="#10b981" font-weight="600">GOAL: 10+</text>
  </g>
</svg>