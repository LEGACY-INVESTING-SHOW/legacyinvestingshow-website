<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{{seoTitle}} | Legacy Investing Show</title>
    <meta name="title" content="{{seoTitle}}">
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="{{keywords}}">
    <meta name="author" content="{{author}}">
    <meta name="robots" content="{{robots}}">
    <meta name="google-site-verification" content="Kec6RfGhFL-qG_8zKxCqt7yxjgy65WeDAftCBm90G2s">
    <meta name="google-site-verification" content="92MoCnkdQOj_ey1lEafT5Mz-znCcCQ3UABZlI-JG_nM">
    <link rel="canonical" href="{{canonicalUrl}}">

    <meta property="og:type" content="article">
    <meta property="og:url" content="{{canonicalUrl}}">
    <meta property="og:title" content="{{title}} | Legacy Investing Show">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="https://www.legacyinvestingshow.com/assets/images/og-home.jpg">
    <meta property="og:site_name" content="Legacy Investing Show">
    <meta property="article:published_time" content="{{isoDate}}">
    <meta property="article:modified_time" content="{{modifiedDate}}">
    <meta property="article:author" content="{{author}}">
    <meta property="article:section" content="{{category}}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@thelegacyshow">
    <meta name="twitter:title" content="{{title}} | Legacy Investing Show">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="https://www.legacyinvestingshow.com/assets/images/og-home.jpg">

    <meta name="theme-color" content="#FBF8F1">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    {{heroPreload}}

    {{headAssets}}
    <link rel="stylesheet" href="/assets/css/blog.css?v=68c90a2e">

    <!-- BreadcrumbList Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://www.legacyinvestingshow.com/"
            },
            {
                "@type": "ListItem",
                "position": 2,
                "name": "Blog",
                "item": "https://www.legacyinvestingshow.com/blog"
            },
            {
                "@type": "ListItem",
                "position": 3,
                "name": "{{title}}",
                "item": "{{canonicalUrl}}"
            }
        ]
    }
    </script>

    <!-- Article Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{title}}",
        "description": "{{description}}",
        "image": {
            "@type": "ImageObject",
            "url": "{{ogImage}}",
            "width": 1200,
            "height": 630
        },
        "author": {{authorSchema}},
        "publisher": {{publisherSchema}},
        "datePublished": "{{isoDate}}",
        "dateModified": "{{modifiedDate}}",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{canonicalUrl}}"
        },
        "articleSection": "{{category}}",
        "wordCount": "{{wordCount}}",
        "keywords": "{{keywords}}",
        "speakable": {
            "@type": "SpeakableSpecification",
            "cssSelector": [".post-title", ".post-prose > p:first-of-type"]
        },
        "isAccessibleForFree": true,
        "inLanguage": "en-US"
    }
    </script>

    <!-- FAQPage Schema (if FAQs exist) -->
    {{faqSchema}}

    <!-- Organization Schema -->
    {{organizationSchema}}

    <!-- Analytics. Emitted once by renderAnalyticsHead() in scripts/lib/site-shell.js.
         Do not hard-code a second GTM/gtag pair here: it double-loads the tag and
         double-counts every pageview. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.google-analytics.com">
    {{analyticsHead}}

</head>
<body data-page-type="blog_post" data-page-title="{{title}}">
    {{analyticsBody}}
    <a href="#main" class="skip-link">Skip to main content</a>

    {{siteHeader}}

    <main id="main">
        <div class="post-page">
        {{articleBody}}
        </div>
    </main>

    {{siteFooter}}

    <script defer src="/assets/js/main.js?v=9f36f306"></script>
</body>
</html>
