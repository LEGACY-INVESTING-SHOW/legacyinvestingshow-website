<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{{seoTitle}}</title>
    <meta name="title" content="{{seoTitle}}">
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="{{keywords}}">
    <meta name="author" content="{{author}}">
    <meta name="robots" content="{{robots}}">
    <meta name="google-site-verification" content="Kec6RfGhFL-qG_8zKxCqt7yxjgy65WeDAftCBm90G2s">
    <meta name="google-site-verification" content="92MoCnkdQOj_ey1lEafT5Mz-znCcCQ3UABZlI-JG_nM">
    <link rel="canonical" href="{{canonicalUrl}}">

    <meta property="og:type" content="article">
    <meta property="og:url" content="{{canonicalUrl}}">
    <meta property="og:title" content="{{title}} | Legacy Investing Show">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="{{ogImage}}">
    <meta property="og:site_name" content="Legacy Investing Show">
    <meta property="article:published_time" content="{{isoDate}}">
    <meta property="article:modified_time" content="{{modifiedDate}}">
    <meta property="article:author" content="{{author}}">
    <meta property="article:section" content="{{category}}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@thelegacyshow">
    <meta name="twitter:title" content="{{title}} | Legacy Investing Show">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{ogImage}}">

    <meta name="theme-color" content="#FAF7F2">
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="apple-touch-icon" href="/assets/images/logo.png">
    {{heroPreload}}

    {{headAssets}}
    <link rel="stylesheet" href="/assets/css/blog.css">

    <!-- BreadcrumbList Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://www.legacyinvestingshow.com/"
            },
            {
                "@type": "ListItem",
                "position": 2,
                "name": "Blog",
                "item": "https://www.legacyinvestingshow.com/blog"
            },
            {
                "@type": "ListItem",
                "position": 3,
                "name": "{{title}}",
                "item": "{{canonicalUrl}}"
            }
        ]
    }
    </script>

    <!-- Article Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{title}}",
        "description": "{{description}}",
        "image": {
            "@type": "ImageObject",
            "url": "{{ogImage}}",
            "width": 1200,
            "height": 630
        },
        "author": {
            "@type": "Person",
            "@id": "https://www.legacyinvestingshow.com/about#author",
            "name": "{{author}}",
            "url": "https://www.legacyinvestingshow.com/about",
            "jobTitle": "Real Estate Investor & Educator",
            "knowsAbout": [
                "Airbnb Arbitrage",
                "Real Estate Investing",
                "Short-Term Rentals",
                "Passive Income Strategies",
                "Property Management"
            ],
            "sameAs": [
                "https://www.instagram.com/thelegacyshow",
                "https://www.youtube.com/@thelegacyinvestingshow",
                "https://www.tiktok.com/@thelegacyshow"
            ]
        },
        "publisher": {
            "@type": "Organization",
            "name": "Legacy Investing Show",
            "url": "https://www.legacyinvestingshow.com",
            "logo": {
                "@type": "ImageObject",
                "url": "https://www.legacyinvestingshow.com/assets/images/logo.png",
                "width": 512,
                "height": 512
            },
            "sameAs": [
                "https://www.instagram.com/thelegacyshow",
                "https://www.youtube.com/@thelegacyinvestingshow",
                "https://www.tiktok.com/@thelegacyshow",
                "https://www.facebook.com/share/19LQhE6gmh/"
            ]
        },
        "datePublished": "{{isoDate}}",
        "dateModified": "{{modifiedDate}}",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{canonicalUrl}}"
        },
        "articleSection": "{{category}}",
        "wordCount": "{{wordCount}}",
        "keywords": "{{keywords}}",
        "speakable": {
            "@type": "SpeakableSpecification",
            "cssSelector": [".post-title", ".post-prose > p:first-of-type"]
        },
        "isAccessibleForFree": true,
        "inLanguage": "en-US"
    }
    </script>

    <!-- FAQPage Schema (if FAQs exist) -->
    {{faqSchema}}

    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Legacy Investing Show",
        "url": "https://www.legacyinvestingshow.com",
        "logo": "https://www.legacyinvestingshow.com/assets/images/logo.png",
        "sameAs": [
            "https://www.instagram.com/thelegacyinvestingshow/",
            "https://www.youtube.com/@LegacyInvestingShow",
            "https://www.tiktok.com/@thelegacyinvestingshow",
            "https://www.facebook.com/share/19LQhE6gmh/"
        ]
    }
    </script>

    {{analyticsHead}}
</head>
<body data-page-type="blog_post" data-page-title="{{title}}">
    {{analyticsBody}}
    <a href="#main" class="skip-link">Skip to main content</a>

    {{siteHeader}}

    <main id="main">
        <div class="post-page">
        {{articleBody}}
        </div>
    </main>

    {{siteFooter}}

    <script defer src="/assets/js/main.js"></script>
</body>
</html>
