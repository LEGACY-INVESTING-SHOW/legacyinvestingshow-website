<!--
  Picture Element Template for Legacy Investing Show

  This template shows how to use the <picture> element with optimized images
  for responsive loading. The browser will automatically choose the best format:
  - AVIF for browsers that support it (best compression)
  - WebP for browsers that don't support AVIF (good compression)
  - Original JPG/PNG as fallback for older browsers

  Usage:
  1. Run the image optimization script: npm run build:images
  2. Copy the appropriate template below and replace the paths/attributes
  3. The manifest.json file can be used to automate this in build scripts
-->

<!-- ============================================ -->
<!-- BASIC USAGE - Single Image                   -->
<!-- ============================================ -->

<picture>
  <source srcset="/assets/images/optimized/example.avif" type="image/avif">
  <source srcset="/assets/images/optimized/example.webp" type="image/webp">
  <img src="/assets/images/example.jpg" alt="Description" loading="lazy">
</picture>


<!-- ============================================ -->
<!-- WITH LAZY LOADING AND DIMENSIONS             -->
<!-- Recommended for better Core Web Vitals       -->
<!-- ============================================ -->

  <source srcset="/assets/images/optimized/example.webp" type="image/webp">

    alt="Descriptive alt text for accessibility"
    loading="lazy"
    decoding="async"
    width="1920"
    height="1080"
  >
</picture>

  <source

    srcset="/assets/images/optimized/example-medium.avif"
    type="image/avif"
  >
  <source
    srcset="/assets/images/optimized/example-small.avif"
    type="image/avif"
  >

  <!-- WebP sources for different sizes -->
  <source
    media="(min-width: 1024px)"
    srcset="/assets/images/optimized/example-large.webp"
    type="image/webp"
  >
  <source
    media="(min-width: 640px)"

    decoding="async"
  >
</picture>

<!-- ============================================ -->
<!-- JAVASCRIPT HELPER (Optional)                 -->
<!-- Auto-generate picture elements from manifest -->
<!-- ============================================ -->

<script>
/**
 * Creates a picture element with optimized image sources
 * Uses the manifest.json generated by the optimization script
 *
 * @param {string} originalPath - Path to original image (e.g., 'preston-main.jpg')
 * @param {string} alt - Alt text for the image
 * @param {object} options - Additional options (loading, class, width, height)
 * @returns {HTMLPictureElement}
 */
async function createOptimizedPicture(originalPath, alt, options = {}) {
  const {
    loading = 'lazy',
    className = '',
    width,
    height,
    eager = false
  } = options;

  const picture = document.createElement('picture');

  // Try to load manifest for optimized paths
  try {
    const response = await fetch('/assets/images/manifest.json');
    const manifest = await response.json();
    const imageData = manifest.images[originalPath];

    if (imageData && !imageData.error) {
      // Add AVIF source
      const avifSource = document.createElement('source');
      avifSource.srcset = `/assets/images/${imageData.avif}`;
      avifSource.type = 'image/avif';
      picture.appendChild(avifSource);

      // Add WebP source
      const webpSource = document.createElement('source');
      webpSource.srcset = `/assets/images/${imageData.webp}`;
      webpSource.type = 'image/webp';
      picture.appendChild(webpSource);
    }
  } catch (e) {
    console.warn('Could not load image manifest, using original image');
  }

  // Add fallback img
  const img = document.createElement('img');
  img.src = `/assets/images/${originalPath}`;
  img.alt = alt;
  img.loading = eager ? 'eager' : loading;
  img.decoding = 'async';
  if (className) img.className = className;
  if (width) img.width = width;
  if (height) img.height = height;

  picture.appendChild(img);
  return picture;
}

// Usage example:
// const picture = await createOptimizedPicture('hero-image.png', 'Hero Image', { eager: true });
// document.querySelector('.hero-container').appendChild(picture);
</script>
