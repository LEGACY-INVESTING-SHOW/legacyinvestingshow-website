  <style>
    :root {
      --brand-50: #f5f0e8;
      --brand-100: #e8dcc4;
      --brand-300: #b8933f;
      --brand-500: #0f172a;
      --brand-700: #0b111f;
      --accent-50: #fbf3e0;
      --accent-500: #d4a853;
      --accent-700: #b8933f;
      --ink: #0f172a;
      --ink-soft: #334155;
      --ink-mute: #64748b;
      --line: #e2e8f0;
      --line-soft: #f1f5f9;
      --paper: #ffffff;
      --bg: #faf7f2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 24px -8px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.03);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.5; }
    .page { max-width: 1320px; margin: 0 auto; padding: 64px 48px 140px; }
    .doc-header { border-bottom: 1px solid var(--line); padding-bottom: 36px; margin-bottom: 64px; }
    .doc-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-700); background: var(--accent-50); padding: 6px 12px; border-radius: 999px; margin-bottom: 18px; }
    .doc-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: var(--accent-500); }
    .doc-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 52px; line-height: 1.05; font-weight: 400; letter-spacing: -0.01em; margin: 0 0 14px; }
    .doc-subtitle { font-size: 18px; color: var(--ink-soft); max-width: 720px; margin: 0 0 28px; line-height: 1.45; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; color: var(--ink-mute); }
    .doc-meta > div { display: flex; gap: 6px; }
    .doc-meta b { color: var(--ink-soft); font-weight: 600; }
    .variant { margin-bottom: 88px; }
    .variant-head { display: grid; grid-template-columns: 64px 1fr; gap: 20px; align-items: start; margin-bottom: 24px; }
    .variant-letter { width: 48px; height: 48px; border-radius: 999px; background: var(--ink); color: #fff; font-family: 'DM Serif Display', Georgia, serif; font-size: 22px; display: flex; align-items: center; justify-content: center; }
    .variant-meta h2 { margin: 4px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
    .variant-tradeoff { font-size: 15px; color: var(--ink-soft); margin: 0; max-width: 760px; }
    .variant-tradeoff b { color: var(--accent-700); font-weight: 600; }
    .preview-row { margin-left: 84px; display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
    .preview-frame { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-md); overflow: hidden; position: relative; width: 420px; flex: 0 0 auto; }
    .preview-frame-bar { background: #faf9f5; border-bottom: 1px solid var(--line-soft); padding: 12px 16px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute); font-weight: 600; }
    .preview { padding: 0; min-height: 200px; }
    .variant-analysis { margin: 24px 0 0 84px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .analysis-block { padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .analysis-block h4 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-700); }
    .analysis-block.is-risk h4 { color: #b8341f; }
    .analysis-block.is-pick h4 { color: #0f5132; }
    .analysis-block p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-soft); }
    .decision { margin-top: 100px; padding: 36px 44px; background: var(--ink); color: #fff; border-radius: 18px; }
    .decision h3 { font-family: 'DM Serif Display', Georgia, serif; font-size: 28px; font-weight: 400; margin: 0 0 8px; }
    .decision-sub { color: rgba(255,255,255,0.65); font-size: 14px; margin: 0 0 24px; }
    .decision-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .decision-cell b { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-500); margin-bottom: 6px; font-weight: 600; }
    .decision-cell span { font-size: 15px; color: rgba(255,255,255,0.85); line-height: 1.45; }
    @media (max-width: 900px) { .page { padding: 40px 20px 80px; } .doc-title { font-size: 36px; } .variant-head { grid-template-columns: 48px 1fr; gap: 12px; } .preview-row, .variant-analysis { margin-left: 0; } .preview-frame { width: 100%; } .variant-analysis { grid-template-columns: 1fr; } }
  </style>
