          - generic [ref=e1049]:
            - generic [ref=e1050]:
              - button "How is achieving zero tax liability legally possible?" [expanded] [ref=e1051] [cursor=pointer]:
                - generic [ref=e1052]: How is achieving zero tax liability legally possible?
                - img [ref=e1053]
              - paragraph [ref=e1057]: Zero tax liability is achieved by generating paper losses that equal or exceed taxable income. Through cost segregation (creating $150K+ in first-year depreciation), Real Estate Professional Status (unlimited passive loss offset against active income), and strategic business entity deductions, Mia and Jay's plan creates $259,700 in deductions against $90,000 in tax liability — resulting in zero net tax and $169,700 in excess deduction capacity for future years.
            - generic [ref=e1058]:
              - button "What is Real Estate Professional Status (REP) and why is it critical?" [ref=e1059] [cursor=pointer]:
                - generic [ref=e1060]: What is Real Estate Professional Status (REP) and why is it critical?
                - img [ref=e1061]
              - paragraph [ref=e1065]: REP Status requires spending 750+ hours annually in real estate activities and more time in real estate than any other profession. It unlocks the ability to use rental real estate losses to offset W-2 or business income without limitation. Without REP, losses up to $25,000 phase out at $100K-$150K income; with REP, unlimited offset is available — the key to eliminating $90,000 in tax liability.
            - generic [ref=e1066]:
              - button "How does the Short-Term Rental (STR) Loophole differ from REP Status?" [ref=e1067] [cursor=pointer]:
                - generic [ref=e1068]: How does the Short-Term Rental (STR) Loophole differ from REP Status?
                - img [ref=e1069]
              - paragraph [ref=e1073]: The STR Loophole (Section 469) allows averaging 100+ hours of material participation per short-term rental property as an alternative path to unlimited loss utilization. Unlike REP, it doesn't require 750+ total hours or real estate as primary occupation. Mia and Jay's plan combines both — STR Loophole for immediate year-one benefit while building toward full REP status for multi-property portfolio optimization.
            - generic [ref=e1074]:
              - button "What happens to the $169,700 in excess deductions?" [ref=e1075] [cursor=pointer]:
                - generic [ref=e1076]: What happens to the $169,700 in excess deductions?
                - img [ref=e1077]
              - paragraph [ref=e1081]: Excess deductions create Net Operating Losses (NOLs) that carry forward indefinitely to offset future taxable income. This creates a 'tax shield' that protects future income — whether from salary increases, business profits, or investment gains. The $169,700 excess from year one provides years of future tax protection, making this a multi-year wealth acceleration strategy.
            - generic [ref=e1082]:
              - button "How does cost segregation on multiple properties compound the benefit?" [ref=e1083] [cursor=pointer]:
                - generic [ref=e1084]: How does cost segregation on multiple properties compound the benefit?
                - img [ref=e1085]
              - paragraph [ref=e1089]: Each property's cost segregation study identifies 20-30% of value as eligible for accelerated depreciation. With bonus depreciation at 80% in 2025, each $500K property generates $100K in year-one write-offs. Three properties = $300K in deductions. Combined with operating expense losses, this creates the $259,700 total tax shelter. The key is timing acquisitions within the same tax year for maximum impact.
            - generic [ref=e1090]:
              - button "Why is Massachusetts specifically mentioned in this tax strategy?" [ref=e1091] [cursor=pointer]:
                - generic [ref=e1092]: Why is Massachusetts specifically mentioned in this tax strategy?
                - img [ref=e1093]
              - paragraph [ref=e1097]: Massachusetts state tax laws interact with federal strategies. With a flat 5% state income tax (9% on short-term capital gains), state tax savings add $13,500+ annually to the federal benefit. Additionally, Massachusetts has specific rules around short-term rentals, pass-through entity taxes, and estate planning that require local expertise to optimize fully within this wealth plan.
