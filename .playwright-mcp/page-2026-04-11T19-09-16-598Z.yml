                - img [ref=e785]
              - paragraph [ref=e789]: With $12,000+ annual capacity for alternative investments and existing crypto exposure, systematic Bitcoin dollar-cost averaging (30% of free cash flow) compounds over time. The plan targets moving 50% of retirement assets to Bitcoin while maintaining MSTY ETF for monthly yield, creating uncapped upside potential with income stability.
            - generic [ref=e790]:
              - button "How does hiring children through an S-Corp create $14,600 tax-free income per child?" [ref=e791] [cursor=pointer]:
                - generic [ref=e792]: How does hiring children through an S-Corp create $14,600 tax-free income per child?
                - img [ref=e793]
              - paragraph [ref=e797]: Children under 18 employed by a parent's S-Corp can earn up to $14,600 (2025 standard deduction) completely federal income tax-free. The S-Corp deducts wages as a business expense, and children can contribute to Roth IRAs, jumpstarting tax-free retirement savings while reducing household tax burden.
            - generic [ref=e798]:
              - button "What is a Section 475(f) election and why file it by March 2026?" [ref=e799] [cursor=pointer]:
                - generic [ref=e800]: What is a Section 475(f) election and why file it by March 2026?
                - img [ref=e801]
              - paragraph [ref=e805]: The Section 475(f) mark-to-market election converts capital gains/losses from trading into ordinary income/losses, enabling trading losses to offset W-2 income directly. Filed with the 2025 tax return by March 15, 2026, it creates a new deduction bucket that can shelter $30,000+ in income while maintaining full Solo 401(k) contribution capacity.
