          - 'heading "Strategy 2: Trader LLC + Section 475(f) Election — Transform Trading Losses into W-2 Shields" [level=2] [ref=e287]'
          - paragraph [ref=e288]:
            - text: "Abigail's existing stock and crypto holdings create an opportunity most investors miss: converting trading losses from capital treatment (limited to $3,000/year against ordinary income) to"
            - strong [ref=e289]: ordinary loss treatment
            - text: that offsets W-2 dollar-for-dollar.
          - heading "The Section 475(f) Mark-to-Market Election" [level=3] [ref=e290]
          - paragraph [ref=e291]:
            - text: Normally, trading losses are capital losses — usable only against capital gains, with excess limited to $3,000/year carryforward. But the
            - strong [ref=e292]: Section 475(f) mark-to-market election
            - text: "changes everything:"
          - list [ref=e293]:
            - listitem [ref=e294]:
              - strong [ref=e295]: Ordinary loss treatment
              - text: ": Trading losses become ordinary business losses"
            - listitem [ref=e296]:
              - strong [ref=e297]: No wash sale rules
              - text: ": Freely trade without 30-day restrictions"
            - listitem [ref=e298]:
              - strong [ref=e299]: Unlimited W-2 offset
              - text: ": Losses directly reduce taxable W-2 income"
            - listitem [ref=e300]:
              - strong [ref=e301]: Solo 401(k) eligibility
              - text: ": Business structure enables retirement contributions"
          - paragraph [ref=e302]:
            - text: For a household with significant trading activity and existing $21,000 capital loss carryforwards, this election could unlock
            - strong [ref=e303]: $30,000+ in additional annual deductions
            - text: .
          - heading "Implementation Requirements" [level=3] [ref=e304]
