            - text: and structuring for
            - strong [ref=e693]: medium-term flexibility
            - text: . If regulations tighten, a cost-segregated property can pivot to long-term rental (still generating depreciation) or be sold with 1031 exchange treatment into a replacement property. The $150,000 depreciation is locked in year one — future regulatory changes don't eliminate already-taken deductions.
