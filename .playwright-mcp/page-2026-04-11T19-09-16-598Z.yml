            - generic [ref=e758]:
              - button "How can cost segregation on a short-term rental eliminate W-2 tax liability?" [expanded] [ref=e759] [cursor=pointer]:
                - generic [ref=e760]: How can cost segregation on a short-term rental eliminate W-2 tax liability?
                - img [ref=e761]
              - paragraph [ref=e765]: Cost segregation accelerates depreciation by separating building components into 5, 7, and 15-year property categories. For a $500-600K STR, this creates up to $150,000 in first-year paper losses. At a 35% tax bracket, these losses offset W-2 income dollar-for-dollar, generating a $52,500 cash refund while building real estate equity.
            - generic [ref=e766]:
              - button "What is the Augusta Rule and how does it save $7,000+ annually?" [ref=e767] [cursor=pointer]:
                - generic [ref=e768]: What is the Augusta Rule and how does it save $7,000+ annually?
                - img [ref=e769]
              - paragraph [ref=e773]: The Augusta Rule (IRC Section 280A) allows homeowners to rent their primary residence to their own business for up to 14 days per year, completely tax-free. At $500/day fair market rate, this moves $7,000 from taxable business income to tax-free personal income while maintaining full mortgage deductions.
            - generic [ref=e774]:
              - button "How does a Roth conversion ladder enable penalty-free early retirement?" [ref=e775] [cursor=pointer]:
                - generic [ref=e776]: How does a Roth conversion ladder enable penalty-free early retirement?
                - img [ref=e777]
              - paragraph [ref=e781]: A Roth conversion ladder converts traditional 401(k) funds to Roth annually, matching conversions to depreciation losses for zero-tax conversions. After 5 years, each conversion tranche becomes accessible penalty-free. Starting in 2025, Abigail's first conversions become available in 2029, creating a penalty-free income stream before age 59½.
            - generic [ref=e782]:
              - button "What makes Bitcoin accumulation a primary wealth strategy in this plan?" [ref=e783] [cursor=pointer]:
