              - paragraph [ref=e1035]: "Justin's plan recognizes Bitcoin's unique characteristics: absolute scarcity (21M cap), decentralization, censorship resistance, and asymmetric upside potential. With $72,000 annual capacity and a 10+ year horizon, systematic Bitcoin accumulation offers uncapped appreciation potential that diversified portfolios cannot match. The plan acknowledges volatility but accepts it as the price of admission for transformational wealth building."
            - generic [ref=e1036]:
              - button "What is the optimal dollar-cost averaging frequency for Bitcoin?" [ref=e1037] [cursor=pointer]:
                - generic [ref=e1038]: What is the optimal dollar-cost averaging frequency for Bitcoin?
                - img [ref=e1039]
              - paragraph [ref=e1043]: Research shows daily, weekly, and monthly DCA perform similarly over long time horizons. Justin's plan specifies monthly $6,000 purchases for simplicity and reduced transaction costs. Weekly ($1,500) or daily ($200) would smooth volatility further but increase complexity. The key is consistency — automated purchases on the same schedule regardless of price.
            - generic [ref=e1044]:
              - button "Why is self-custody at 1 BTC important versus exchange storage?" [ref=e1045] [cursor=pointer]:
                - generic [ref=e1046]: Why is self-custody at 1 BTC important versus exchange storage?
                - img [ref=e1047]
              - paragraph [ref=e1051]: Exchange custody introduces counterparty risk (hacks, insolvency, regulatory freezes). At 1 BTC (current value ~$70,000-$100,000), the risk of exchange loss exceeds the cost and complexity of self-custody. Hardware wallets ($100-$200) with 2-of-3 multi-sig setup provide institutional-grade security without third-party dependence. The plan treats this as a rite of passage in Bitcoin ownership.
