                - img [ref=e1063]
              - paragraph [ref=e1067]: The plan embraces volatility as feature, not bug. Bear markets allow accumulation of more satoshis per dollar. Historical data shows every 4-year cycle has delivered higher lows and higher highs. The $6,000 monthly commitment continues regardless of price — buying more when price is low, fewer when high. The 10+ year horizon absorbs multiple cycles.
